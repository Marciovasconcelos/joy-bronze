<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div>☀️ <b>Bronze Agenda — Administração</b></div><button id="logout">Sair</button></header>
<main class="container">
<div class="grid">
<section class="card"><h2>Agenda</h2><label>Filtrar por data</label><input id="filtroData" type="date"><div id="agenda">Carregando...</div></section>
<section class="card">
<h2>Configurações</h2>
<label>Nome do salão</label><input id="nomeSalao" placeholder="Meu Salão">
<label>Horário de abertura</label><input id="abertura" type="time" value="09:00">
<label>Horário de fechamento</label><input id="fechamento" type="time" value="18:00">
<label>Intervalo entre horários (min)</label><input id="intervalo" type="number" value="60">
<h3>🔔 Lembretes</h3>
<label><input id="lembrete24" type="checkbox" checked> 24 horas antes</label>
<label><input id="lembrete2" type="checkbox"> 2 horas antes</label>
<label><input id="lembrete1" type="checkbox"> 1 hora antes</label>
<label><input id="lembrete30" type="checkbox"> 30 minutos antes</label>
<button id="salvarConfig">Salvar configurações</button>
</section>
</div>
<section class="card"><h2>Serviços</h2>
<input id="novoServico" placeholder="Nome do serviço"><input id="duracao" type="number" placeholder="Duração em minutos">
<input id="preco" type="number" step="0.01" placeholder="Preço">
<button id="addServico">Adicionar serviço</button><div id="servicos"></div>
</section>
</main>
<script type="module" src="firebase-config.js"></script><script type="module" src="admin.js"></script>
</body></html>
